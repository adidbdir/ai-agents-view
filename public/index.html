<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Agents View — Claude Code Sessions</title>
<style>
  :root {
    --bg-1: #f5f8fc;
    --bg-2: #e8eef6;
    --navy: #1d2b3a;
    --navy-2: #24384d;
    --slate: #55677a;
    --cyan: #2fb9dd;
    --cyan-glow: #59d2f2;
    --blue: #3a7bd5;
    --gray-txt: #8a97a6;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", -apple-system, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 700px at 75% -10%, #ffffff 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color: var(--navy);
    overflow: hidden;
  }
  #app { position: relative; width: 100vw; height: 100vh; }

  /* ── タイトルカプセル ─────────────────────────── */
  .title-capsule {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #5f7185 0%, #4c5e71 100%);
    color: #fff; font-size: 26px; font-weight: 800; letter-spacing: .04em;
    padding: 12px 56px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(45, 62, 80, .28), inset 0 1px 0 rgba(255,255,255,.25);
    white-space: nowrap; z-index: 20;
  }
  .title-capsule small { display:block; text-align:center; font-size: 11px; font-weight: 600; opacity:.8; letter-spacing:.18em; margin-top:2px; }

  /* ── 統計チップ ──────────────────────────────── */
  .stats {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 20;
  }
  .stat {
    background: var(--card); border-radius: 14px; padding: 8px 16px;
    box-shadow: 0 4px 14px rgba(40, 60, 90, .10);
    text-align: center; min-width: 86px;
  }
  .stat .v { font-size: 20px; font-weight: 800; color: var(--navy); line-height: 1.15; }
  .stat .v.cyan { color: var(--cyan); }
  .stat .k { font-size: 10px; color: var(--gray-txt); font-weight: 600; letter-spacing: .05em; }

  /* ── 凡例 ────────────────────────────────────── */
  .legend {
    position: absolute; left: 26px; bottom: 22px; z-index: 20;
    background: rgba(255,255,255,.85); backdrop-filter: blur(6px);
    border-radius: 14px; padding: 12px 16px;
    box-shadow: 0 4px 14px rgba(40,60,90,.10);
    font-size: 12px; color: var(--slate);
  }
  .legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .dot.active { background: var(--cyan); box-shadow: 0 0 8px var(--cyan-glow); }
  .dot.recent { background: var(--blue); }
  .dot.idle   { background: #b3bfcc; }

  .updated {
    position: absolute; right: 26px; bottom: 22px; z-index: 20;
    font-size: 11px; color: var(--gray-txt);
  }

  /* ── SVG ステージ ───────────────────────────── */
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node-g { cursor: pointer; }
  .node-g text { pointer-events: none; }

  @keyframes pulse {
    0%   { transform: scale(1);   opacity: .55; }
    70%  { transform: scale(1.5); opacity: 0; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  .pulse-ring { transform-origin: center; transform-box: fill-box; animation: pulse 2.2s ease-out infinite; }

  @keyframes flow { to { stroke-dashoffset: -26; } }
  .link { fill: none; stroke: var(--cyan); stroke-width: 2.4; stroke-dasharray: 2 11;
          stroke-linecap: round; animation: flow 1.4s linear infinite; opacity: .8; }
  .link.idle { stroke: #b9c5d1; animation-duration: 3.2s; opacity: .45; }

  /* 人物・オフィス小物のアニメーション */
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.6px); } }
  .bob { animation: bob 1.1s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  .sway { transform-origin: center bottom; transform-box: fill-box; animation: sway 2.6s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .blink  { animation: blink 1.6s ease-in-out infinite; }
  .blink2 { animation: blink 1.6s ease-in-out infinite; animation-delay: .8s; }

  /* ── 詳細パネル ─────────────────────────────── */
  .panel {
    position: absolute; top: 0; right: 0; height: 100%; width: 400px; max-width: 92vw;
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    box-shadow: -12px 0 40px rgba(30,45,65,.18);
    transform: translateX(105%); transition: transform .28s ease;
    z-index: 30; display: flex; flex-direction: column;
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff; padding: 22px 22px 18px;
  }
  .panel-head .pj { font-size: 20px; font-weight: 800; word-break: break-all; }
  .panel-head .pth { font-size: 11px; opacity: .65; margin-top: 4px; word-break: break-all; }
  .panel-head .close {
    position: absolute; top: 14px; right: 14px; width: 30px; height: 30px;
    border: none; border-radius: 50%; background: rgba(255,255,255,.15); color: #fff;
    font-size: 15px; cursor: pointer;
  }
  .panel-head .badges { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(255,255,255,.14);
  }
  .badge.on { background: var(--cyan); color: #06303c; }
  .panel-body { flex: 1; overflow-y: auto; padding: 16px 18px 24px; }
  .sec-title { font-size: 12px; font-weight: 800; color: var(--gray-txt); letter-spacing: .1em; margin: 14px 0 8px; }

  .runs { background: #f2f6fa; border-radius: 12px; padding: 12px; }
  .runs svg { display: block; width: 100%; }

  .sess {
    background: var(--card); border: 1px solid #e4eaf1; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
    box-shadow: 0 2px 8px rgba(40,60,90,.05);
  }
  .sess .t { display: flex; align-items: flex-start; gap: 8px; }
  .sess .t .dot { margin-top: 4px; }
  .sess .name { font-size: 13.5px; font-weight: 700; line-height: 1.4; flex: 1; }
  .sess .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip {
    font-size: 10.5px; font-weight: 600; color: var(--slate);
    background: #eef3f8; border-radius: 999px; padding: 3px 9px;
  }
  .chip.model { background: #e2f5fb; color: #16758f; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tool { font-size: 10.5px; font-family: ui-monospace, "SF Mono", monospace;
          background: var(--navy); color: #cfe9f5; border-radius: 6px; padding: 3px 8px; }
  .empty { color: var(--gray-txt); font-size: 13px; text-align: center; padding: 30px 0; }

  /* ── Google 今日の予定パネル ─────────────────── */
  .gcal-btn {
    position: absolute; top: 22px; left: 26px; z-index: 20;
    background: var(--card); border: none; border-radius: 14px;
    padding: 10px 16px; cursor: pointer; text-align: left;
    box-shadow: 0 4px 14px rgba(40,60,90,.10);
    font-family: inherit; color: var(--navy);
  }
  .gcal-btn:hover { box-shadow: 0 6px 18px rgba(40,60,90,.16); }
  .gcal-btn .b1 { font-size: 13.5px; font-weight: 800; }
  .gcal-btn .b2 { font-size: 10.5px; color: var(--gray-txt); font-weight: 600; margin-top: 2px; }
  .gcal-btn .b2 .on { color: var(--cyan); }

  .gpanel {
    position: absolute; top: 0; left: 0; height: 100%; width: 390px; max-width: 92vw;
    background: rgba(255,255,255,.97); backdrop-filter: blur(10px);
    box-shadow: 12px 0 40px rgba(30,45,65,.18);
    transform: translateX(-105%); transition: transform .28s ease;
    z-index: 31; display: flex; flex-direction: column;
  }
  .gpanel.open { transform: translateX(0); }
  .gpanel .panel-head { position: relative; }
  .gpanel .close { left: auto; right: 14px; }
  .gsummary {
    font-size: 12px; line-height: 1.7; background: #f2f6fa;
    border-radius: 12px; padding: 10px 14px; color: #3c4c5d;
  }
  .gev {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 10px; border-radius: 10px; margin-bottom: 4px;
    border-left: 3px solid transparent;
  }
  .gev .tm { flex: none; width: 84px; font-size: 12px; font-weight: 800; color: var(--slate); padding-top: 1px; }
  .gev .ttl { font-size: 13px; font-weight: 700; line-height: 1.4; }
  .gev .sub { font-size: 10.5px; color: var(--gray-txt); margin-top: 2px; word-break: break-all; }
  .gev .sub a { color: #16758f; }
  .gev.now  { background: #e2f5fb; border-left-color: var(--cyan); }
  .gev.next { background: #eef3f8; border-left-color: var(--blue); }
  .gev.past { opacity: .45; }
  .gev .tag { font-size: 9.5px; font-weight: 800; border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
  .gev.now  .tag { background: var(--cyan); color: #06303c; }
  .gev.next .tag { background: var(--blue); color: #fff; }

  .gtask { display: flex; gap: 9px; align-items: flex-start; padding: 6px 4px; }
  .gtask input[type=checkbox] { width: 16px; height: 16px; margin-top: 1px; accent-color: var(--cyan); cursor: pointer; flex: none; }
  .gtask .ttl { font-size: 13px; font-weight: 600; line-height: 1.45; }
  .gtask.done .ttl { text-decoration: line-through; color: var(--gray-txt); font-weight: 500; }
  .gtask .due { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 7px; margin-left: 6px; background: #eef3f8; color: var(--slate); vertical-align: 1px; }
  .gtask .due.over { background: #fdecec; color: #c0392b; }
  .gtask .notes { font-size: 10.5px; color: var(--gray-txt); margin-top: 1px; }
  .gadd { display: flex; gap: 6px; margin: 6px 0 14px; }
  .gadd input {
    flex: 1; font-size: 12.5px; font-family: inherit; padding: 7px 10px;
    border: 1px solid #d5dde6; border-radius: 10px; background: #fff; color: var(--navy);
  }
  .gadd button {
    border: none; border-radius: 10px; background: var(--navy); color: #fff;
    font-size: 12px; font-weight: 700; padding: 0 14px; cursor: pointer;
  }
  .gconnect {
    display: block; text-align: center; text-decoration: none;
    background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #fff;
    font-size: 14px; font-weight: 800; border-radius: 12px; padding: 12px; margin: 14px 0;
  }
  .gsetup { font-size: 12px; line-height: 1.8; color: #3c4c5d; }
  .gsetup code { background: #eef3f8; border-radius: 5px; padding: 1px 5px; font-size: 11px; }
  .gsetup ol { padding-left: 18px; }

  /* ── 秘書アシスタント・チャット ───────────────── */
  .spanel { width: 420px; }
  .spanel .panel-head { position: relative; background: linear-gradient(135deg, #4a2f66 0%, #6d4a86 100%); }
  .schat {
    flex: 1; overflow-y: auto; padding: 16px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sbubble {
    max-width: 84%; padding: 10px 13px; border-radius: 14px;
    font-size: 13px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .sbubble.user { align-self: flex-end; background: var(--navy); color: #fff; border-bottom-right-radius: 4px; }
  .sbubble.bot  { align-self: flex-start; background: #f2f0f7; color: #2b2536; border-bottom-left-radius: 4px; }
  .sbubble.bot.err { background: #fdecec; color: #c0392b; }
  .sbubble .role { display: block; font-size: 10px; font-weight: 700; opacity: .55; margin-bottom: 3px; }
  .styping { align-self: flex-start; padding: 8px 6px; }
  .styping span {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: #b9a7cc; margin: 0 2px; animation: sdot 1s infinite;
  }
  .styping span:nth-child(2) { animation-delay: .15s; }
  .styping span:nth-child(3) { animation-delay: .3s; }
  @keyframes sdot { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .ssug { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 0; }
  .schip {
    font-size: 11.5px; font-weight: 600; color: #5a3e7a; background: #efe6f6;
    border: none; border-radius: 999px; padding: 6px 11px; cursor: pointer; font-family: inherit;
  }
  .schip:hover { background: #e3d3f0; }
  .sform { display: flex; gap: 8px; padding: 12px 14px 16px; border-top: 1px solid #ece7f2; }
  .sform textarea {
    flex: 1; resize: none; font-family: inherit; font-size: 13px; line-height: 1.5;
    padding: 9px 12px; border: 1px solid #d5dde6; border-radius: 12px; max-height: 120px;
    background: #fff; color: var(--navy);
  }
  .sform button {
    border: none; border-radius: 12px; color: #fff; font-weight: 700; padding: 0 16px;
    cursor: pointer; background: linear-gradient(135deg, #4a2f66, #6d4a86); font-family: inherit; font-size: 13px;
  }
  .sform button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <div class="title-capsule">AI Agents View<small>CLAUDE CODE SESSION MONITOR</small></div>

  <button class="gcal-btn" id="gcal-btn" onclick="openGPanel()">
    <div class="b1">📅 今日の予定</div>
    <div class="b2" id="gcal-sub">Google カレンダー / ToDo</div>
  </button>

  <div class="gpanel" id="gpanel">
    <div class="panel-head">
      <button class="close" onclick="closeGPanel()">✕</button>
      <div class="pj" id="g-date"></div>
      <div class="pth">Google カレンダー ・ Google ToDo</div>
      <div class="badges" id="g-badges"></div>
    </div>
    <div class="panel-body" id="g-body"></div>
  </div>

  <svg id="stage" preserveAspectRatio="xMidYMid meet"></svg>

  <div class="legend">
    <div class="row"><span class="dot active"></span>稼働中 — 着席して作業中</div>
    <div class="row"><span class="dot recent"></span>直近1時間 — デスク横で待機</div>
    <div class="row"><span class="dot idle"></span>待機中 — 空席</div>
    <div class="row" style="margin-top:8px">表示期間
      <select id="range" style="font-size:12px;border:1px solid #d5dde6;border-radius:8px;padding:2px 6px;background:#fff;color:#3c4c5d">
        <option value="1">24時間</option>
        <option value="7">7日</option>
        <option value="30" selected>30日</option>
        <option value="all">すべて</option>
      </select>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="updated" id="updated"></div>

  <div class="panel" id="panel">
    <div class="panel-head" style="position:relative">
      <button class="close" onclick="closePanel()">✕</button>
      <div class="pj" id="p-name"></div>
      <div class="pth" id="p-path"></div>
      <div class="badges" id="p-badges"></div>
    </div>
    <div class="panel-body" id="p-body"></div>
  </div>

  <div class="panel spanel" id="spanel">
    <div class="panel-head">
      <button class="close" onclick="closeSPanel()">✕</button>
      <div class="pj">秘書アシスタント</div>
      <div class="pth" id="s-sub">今日の予定・タスクの相談</div>
    </div>
    <div class="schat" id="s-chat"></div>
    <div class="ssug" id="s-sug"></div>
    <form class="sform" id="s-form" onsubmit="return sendSecretary(event)">
      <textarea id="s-input" rows="1" placeholder="今日やるべきこと・予定・準備について聞く…" maxlength="2000"></textarea>
      <button type="submit" id="s-send">送信</button>
    </form>
  </div>
</div>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);

let DATA = null;
let selectedId = null;

/* ══════════ ユーティリティ ══════════ */
function el(name, attrs = {}, children = []) {
  const e = document.createElementNS(SVGNS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const c of children) e.appendChild(c);
  return e;
}
function txt(e, s) { e.textContent = s; return e; }
function fmtNum(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'k';
  return String(n);
}
function timeAgo(ts) {
  if (!ts) return '—';
  const d = (Date.now() - Date.parse(ts)) / 1000;
  if (d < 60) return 'たった今';
  if (d < 3600) return Math.floor(d / 60) + '分前';
  if (d < 86400) return Math.floor(d / 3600) + '時間前';
  return Math.floor(d / 86400) + '日前';
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ══════════ アイソメトリック投影 ══════════ */
const VIEW = { w: 1400, h: 860 };
const PLATE = { cx: 700, cy: 465, w: 960, h: 480 };
// (u,v) ∈ [0,1]² → 画面座標 / (0,0)=手前, (1,1)=奥
function iso(u, v) {
  return {
    x: PLATE.cx + (u - v) * PLATE.w / 2,
    y: PLATE.cy + (1 - u - v) * PLATE.h / 2,
  };
}

/* ══════════ 低レベル描画部品 ══════════ */
// アイソメの直方体。A=(1,.5) 方向に la、B=(1,-.5) 方向に lb、高さ h
function isoBox(cx, cy, la, lb, h, colTop, colL, colR, attrs = {}) {
  const p0 = [cx - (la + lb) / 2, cy - (la - lb) / 4];
  const p1 = [p0[0] + la, p0[1] + la / 2];
  const p2 = [p1[0] + lb, p1[1] - lb / 2];
  const p3 = [p0[0] + lb, p0[1] - lb / 2];
  const up = (p) => [p[0], p[1] - h];
  const T = [p0, p1, p2, p3].map(up);
  const d = (pts) => 'M' + pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L') + ' Z';
  const g = el('g', attrs);
  g.appendChild(el('path', { d: d([T[0], T[1], p1, p0]), fill: colL }));
  g.appendChild(el('path', { d: d([T[1], T[2], p2, p1]), fill: colR }));
  g.appendChild(el('path', { d: d(T), fill: colTop }));
  return g;
}

// 床タイル(ひし形)。中心 (0,0)、半幅 w・半高 hh
function tilePath(w, hh) {
  return `M${-w},0 L0,${-hh} L${w},0 L0,${hh} Z`;
}

/* 人物(足元が原点)。pose: 'stand' | 'work' | 'present' */
function person(opts = {}) {
  const {
    pose = 'stand', suit = '#2c4157', shirt = '#d9e9f4',
    skin = '#f2c9a2', hair = '#26343f', flip = false, anim = null,
  } = opts;
  const outer = el('g', { transform: flip ? 'scale(-1,1)' : '' });
  const g = el('g', anim ? { class: anim } : {});
  outer.appendChild(el('ellipse', { cx: 0, cy: 1.5, rx: 10, ry: 3.2, fill: '#31424f', opacity: .16 }));

  // 脚
  if (pose === 'stand' || pose === 'present') {
    g.appendChild(el('rect', { x: -5.5, y: -17, width: 4.6, height: 17, rx: 2, fill: '#232f3c' }));
    g.appendChild(el('rect', { x: 1, y: -17, width: 4.6, height: 17, rx: 2, fill: '#2b3947' }));
  } else if (pose === 'work') {
    // 着席(脚は椅子と一体で簡略化)
    g.appendChild(el('rect', { x: -7, y: -14, width: 14, height: 9, rx: 3, fill: '#232f3c' }));
  }
  // 胴体(スーツ)
  g.appendChild(el('path', {
    d: 'M-8,-37 Q0,-41.5 8,-37 L6.6,-15.5 L-6.6,-15.5 Z', fill: suit,
  }));
  // シャツ襟元
  g.appendChild(el('path', { d: 'M-2.6,-37.5 L0,-30.5 L2.6,-37.5 Z', fill: shirt }));
  // 腕
  if (pose === 'present') {
    g.appendChild(el('path', { d: 'M-7,-35 C-10,-30 -10.5,-24 -9.5,-19', stroke: suit, 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none' }));
    g.appendChild(el('path', { d: 'M7,-35 C12,-37 16,-40 19,-43', stroke: suit, 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none' }));
    g.appendChild(el('circle', { cx: 20, cy: -44, r: 2.4, fill: skin }));
  } else if (pose === 'work') {
    g.appendChild(el('path', { d: 'M-7,-34 C-10,-30 -9,-26 -5,-23', stroke: suit, 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none' }));
    g.appendChild(el('path', { d: 'M7,-34 C10,-30 9,-26 5,-23', stroke: suit, 'stroke-width': 4, 'stroke-linecap': 'round', fill: 'none' }));
  } else {

/* ══════════ レイアウト ══════════ */
// デスクの配置。
// 4台まで: 風車型(中央にミーティングテーブル) / 5台以上: グリッド配置(デスクを自動縮小)
const SLOTS_4 = [
  [.32, .18], [.82, .32], [.18, .68], [.70, .90],
];
function layoutProjects(projects) {
  const n = projects.length;
  if (n <= 4) {
    return {
      cozy: true,
      placed: projects.map((p, i) => ({ p, u: SLOTS_4[i][0], v: SLOTS_4[i][1], scale: 1 })),
    };
  }
  // グリッド: 手前の行から新しい順に埋める
  const cols = Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / cols);
  const m = .12;
  const su = (1 - 2 * m) / cols;
  const sv = (1 - 2 * m) / rows;
  // 隣接デスクの画面距離からスケールを決める(デスク一式の幅 ≈ 170px)
  const gap = Math.min(su, sv) * (PLATE.w / 2) * 1.118;
  const scale = Math.max(.42, Math.min(1, gap / 175));
  const placed = projects.map((p, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    return {
      p,
      u: m + (col + .5) * su,
      v: m + (row + .5) * sv, // row 0 = 手前(最新)
      scale,
    };
  });
  return { cozy: false, placed };
}

/* ══════════ 描画 ══════════ */
function render() {
  if (!DATA) return;
  const svg = $('stage');
  svg.setAttribute('viewBox', `0 0 ${VIEW.w} ${VIEW.h}`);
  svg.innerHTML = '';
  svg.appendChild(buildDefs());
  svg.appendChild(buildPlate());

  // 表示期間フィルタ
  const all = DATA.projects || [];
  const rangeVal = $('range').value;
  const days = rangeVal === 'all' ? Infinity : Number(rangeVal);
  const now = Date.now();
  const projects = isFinite(days)
    ? all.filter((p) => p.lastTs && now - Date.parse(p.lastTs) < days * 86400e3)
    : all;
  const hidden = all.length - projects.length;

  const { cozy, placed } = layoutProjects(projects);
  const hub = iso(.5, .5);

  // 接続線(コンパクト表示のときのみ / 家具より下のレイヤー)
  if (cozy) {
    const linkLayer = el('g');
    svg.appendChild(linkLayer);
    for (const { p, u, v } of placed) {
      const pt = iso(u, v);
      const mx = (pt.x + hub.x) / 2, my = (pt.y + hub.y) / 2 - 20;
      linkLayer.appendChild(el('path', {
        d: `M${pt.x},${pt.y} Q${mx},${my} ${hub.x},${hub.y}`,
        class: 'link' + (p.status === 'idle' ? ' idle' : ''),
      }));
    }
  }

  // シーンアイテムを奥→手前の順に描画(ペインターアルゴリズム)
  const items = [];

  // グリッド表示のときは装飾を四隅の植物だけに間引く
  const deco = cozy ? [
    { u: .46, v: .94, build: whiteboard },
    { u: .88, v: .72, build: serverRack },
    { u: .13, v: .34, build: coffeeCorner },
    { u: .07, v: .93, build: plant },
    { u: .93, v: .93, build: plant },
    { u: .07, v: .07, build: plant },
    { u: .93, v: .07, build: plant },
  ] : [
    { u: .04, v: .96, build: plant },
    { u: .96, v: .96, build: plant },
    { u: .04, v: .04, build: plant },
    { u: .96, v: .04, build: plant },
  ];
  for (const d of deco) {
    const pt = iso(d.u, d.v);
    const g = d.build();
    g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    items.push({ y: pt.y, el: g });
  }

  if (cozy) { // 中央ミーティングテーブル
    const g = meetingTable();
    g.setAttribute('transform', `translate(${hub.x},${hub.y})`);
    items.push({ y: hub.y, el: g });
  }

  for (const { p, u, v, scale } of placed) {
    const pt = iso(u, v);
    const g = workstation(p);
    g.setAttribute('transform', `translate(${pt.x},${pt.y}) scale(${scale})`);
    // click だと再描画とマウス操作が競合して不発になることがあるため pointerdown
    g.addEventListener('pointerdown', () => openPanel(p.id || p.dirName));
    items.push({ y: pt.y, el: g });
  }

  // 秘書(常に最前面・クリックでチャット)
  {
    const pt = iso(.08, .08);
    const g = secretaryStation();
    g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
    g.addEventListener('pointerdown', openSPanel);
    items.push({ y: pt.y + 1e4, el: g });
  }

  items.sort((a, b) => a.y - b.y);
  for (const it of items) svg.appendChild(it.el);

  renderStats(projects);
  $('updated').textContent = updatedLine();

  if (selectedId) {
    const p = all.find((x) => (x.id || x.dirName) === selectedId);
    if (p) fillPanel(p);
  }
}

function updatedLine() {
  const all = (DATA && DATA.projects) || [];
  const rangeVal = $('range').value;
  const days = rangeVal === 'all' ? Infinity : Number(rangeVal);
  const hidden = isFinite(days)
    ? all.filter((p) => !p.lastTs || Date.now() - Date.parse(p.lastTs) >= days * 86400e3).length
    : 0;
  let s = '更新: ' + new Date(DATA.generatedAt).toLocaleTimeString('ja-JP');
  if (hidden > 0) s = `期間外 ${hidden} 件を非表示 ・ ` + s;
  const bad = (DATA.peers || []).filter((x) => !x.ok);
  if (bad.length) s += ` ・ ⚠ 接続不可: ${bad.map((x) => x.host || x.url).join(', ')}`;
  return s;
}

function renderStats(projects) {
  const active = projects.filter((p) => p.status === 'active').length;
  const sessions = projects.reduce((a, p) => a + p.sessionCount, 0);
  const tools = projects.reduce((a, p) => a + p.totalToolCalls, 0);
  const out = projects.reduce((a, p) => a + p.outputTokens, 0);
  const hosts = new Set(projects.map((p) => p.host).filter(Boolean)).size;
  $('stats').innerHTML = `
    ${hosts > 1 ? `<div class="stat"><div class="v">${hosts}</div><div class="k">ホスト</div></div>` : ''}
    <div class="stat"><div class="v">${projects.length}</div><div class="k">プロジェクト</div></div>
    <div class="stat"><div class="v cyan">${active}</div><div class="k">稼働中</div></div>
    <div class="stat"><div class="v">${sessions}</div><div class="k">セッション</div></div>
    <div class="stat"><div class="v">${fmtNum(tools)}</div><div class="k">ツール実行</div></div>
    <div class="stat"><div class="v">${fmtNum(out)}</div><div class="k">出力トークン</div></div>`;
}

        ${s.gitBranch ? `<span class="chip">⎇ ${esc(s.gitBranch)}</span>` : ''}
        <span class="chip">💬 ${s.userMessages + s.assistantMessages}</span>

      </div>
      ${(s.agents || []).filter((a) => a.running).map((a) =>
        `<div style="font-size:10.5px;color:#16758f;margin-top:6px">▶ ${esc(a.agentType || 'agent')}: ${esc((a.description || '').slice(0, 40))}</div>`).join('')}
      ${toolEntries.length ? `<div class="tools">${toolEntries.map(([n, c]) => `<span class="tool">${esc(n)}×${c}</span>`).join('')}</div>` : ''}

/** 直近30日の実行状況(SVG文字列) */
function runsTimeline(p) {
  const W = 340, H = 74, days = 30;
  const now = Date.now();
  const t0 = now - days * 86400e3;
  const daily = new Array(days).fill(0);
  for (const s of p.sessions) {
    for (const [h, c] of Object.entries(s.hourly)) {
      const t = Date.parse(h + ':00:00Z');
      if (t >= t0) {
        const idx = Math.min(days - 1, Math.floor((t - t0) / 86400e3));
        daily[idx] += c;
      }
    }
  }
  const max = Math.max(1, ...daily);
  const bw = W / days;
  let bars = '';
  for (let i = 0; i < days; i++) {
    const hgt = daily[i] ? Math.max(3, (daily[i] / max) * (H - 26)) : 0;
    if (!hgt) continue;
    const recent = i >= days - 2;
    bars += `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - 18 - hgt).toFixed(1)}"
      width="${(bw - 2).toFixed(1)}" height="${hgt.toFixed(1)}" rx="2"
      fill="${recent ? '#2fb9dd' : '#8fb3cc'}"/>`;
  }
  let marks = '';
  for (const s of p.sessions) {
    if (!s.firstTs) continue;
    const t = Date.parse(s.firstTs);
    if (t < t0) continue;
    const x = ((t - t0) / (days * 86400e3)) * W;
    marks += `<path d="M${x.toFixed(1)},${H - 10} l4,5 l-4,5 l-4,-5 Z" fill="#1d2b3a"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H + 6}">
    <line x1="0" y1="${H - 18}" x2="${W}" y2="${H - 18}" stroke="#c9d4df" stroke-width="1"/>
    ${bars}${marks}
    <text x="0" y="${H + 4}" font-size="9" fill="#8a97a6">30日前</text>
    <text x="${W}" y="${H + 4}" font-size="9" fill="#8a97a6" text-anchor="end">今日</text>
  </svg>
  <div style="font-size:10.5px;color:#8a97a6;margin-top:6px">棒: アクティビティ量 / ◆: セッション開始</div>`;
}

/* ══════════ データ取得ループ ══════════ */
let lastRenderKey = null;
let lastRenderMs = 0;
async function tick() {
  try {
    const r = await fetch('/api/data');
    DATA = await r.json();
    // データが変わった時だけ再描画(アニメーションのリセットとクリック競合を防ぐ)。
    // 経過時間表示の更新のため60秒ごとには必ず描画する。
    const key = JSON.stringify(DATA.projects);
    const now = Date.now();
    if (key !== lastRenderKey || now - lastRenderMs > 60e3) {
      lastRenderKey = key;
      lastRenderMs = now;
      render();
    } else {
      $('updated').textContent = '更新: ' + new Date(DATA.generatedAt).toLocaleTimeString('ja-JP');
    }
  } catch (e) {
    $('updated').textContent = '接続エラー: サーバーを確認してください';
  }
}
tick();
setInterval(tick, 3000);
window.addEventListener('resize', () => render());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePanel(); closeGPanel(); closeSPanel(); } });
$('range').addEventListener('change', () => { lastRenderKey = null; render(); });

/* ══════════ Google 今日の予定 / タスク ══════════ */
let GDATA = null;

function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function evState(e) { // 'past' | 'now' | 'future'
  if (e.allDay) return 'now';
  const now = Date.now();
  if (Date.parse(e.end) <= now) return 'past';
  if (Date.parse(e.start) <= now) return 'now';
  return 'future';
}

async function gtick() {
  try {
    const r = await fetch('/api/agenda');
    GDATA = await r.json();
  } catch { GDATA = null; }
  renderGoogle();
}

function gTaskStats() {
  let total = 0, done = 0, overdue = 0;
  for (const l of GDATA.taskLists || []) {
    for (const t of l.tasks) {
      total++;
      if (t.completed) done++;
      else if (t.due && t.due < todayStr()) overdue++;
    }
  }
  return { total, done, overdue };
}

/** 今日のまとめ文 */
function gSummaryHtml() {
  const evs = GDATA.events || [];
  const timed = evs.filter((e) => !e.allDay);
  const nowEv = timed.find((e) => evState(e) === 'now');
  const nextEv = timed.find((e) => evState(e) === 'future');
  const { total, done, overdue } = gTaskStats();
  const parts = [];
  if (!evs.length) parts.push('今日の予定はありません。');
  else {
    let s = `予定は <b>${evs.length}件</b>`;
    if (timed.length) s += `(${fmtTime(timed[0].start)}〜${fmtTime(timed[timed.length - 1].end)})`;
    parts.push(s + '。');
  }
  if (nowEv) parts.push(`進行中: <b>${esc(nowEv.summary)}</b>(〜${fmtTime(nowEv.end)})。`);
  if (nextEv) {
    const min = Math.max(0, Math.round((Date.parse(nextEv.start) - Date.now()) / 60000));
    const rel = min < 60 ? `あと${min}分` : `あと${Math.floor(min / 60)}時間${min % 60 ? (min % 60) + '分' : ''}`;
    parts.push(`次は ${fmtTime(nextEv.start)}〜 <b>${esc(nextEv.summary)}</b>(${rel})。`);
  }
  if (total) {
    let s = `タスクは 残り <b>${total - done}件</b> / 完了 ${done}件`;
    if (overdue) s += `(<span style="color:#c0392b;font-weight:700">期限切れ ${overdue}件</span>)`;
    parts.push(s + '。');
  } else parts.push('タスクはありません。');
  return `<div class="gsummary">${parts.join(' ')}</div>`;
}

function renderGoogle() {
  const sub = $('gcal-sub');
  const d = new Date();
  $('g-date').textContent =
    `${d.getMonth() + 1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;

  if (!GDATA) { sub.textContent = 'サーバーに接続できません'; $('g-body').innerHTML = '<div class="empty">サーバーに接続できません</div>'; $('g-badges').innerHTML = ''; return; }

  if (!GDATA.configured) {
    sub.textContent = '未設定 — クリックして設定方法を表示';
    $('g-badges').innerHTML = '<span class="badge">未設定</span>';
    $('g-body').innerHTML = `
      <div class="sec-title">セットアップ</div>
      <div class="gsetup">
        Google カレンダー / ToDo と連携するには、一度だけ OAuth クライアントの作成が必要です:
        <ol>
          <li><a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a> でプロジェクトを作成</li>
          <li>「APIとサービス → ライブラリ」で <b>Google Calendar API</b> と <b>Google Tasks API</b> を有効化</li>
          <li>「認証情報 → 認証情報を作成 → OAuth クライアント ID」で種類 <b>デスクトップアプリ</b> を選択して作成<br>(初回は OAuth 同意画面の設定が必要。テストユーザーに自分の Gmail を追加)</li>
          <li>JSON をダウンロードし、このアプリのフォルダに <code>google-credentials.json</code> として保存</li>
          <li>サーバーを再起動せずそのまま、下の「連携する」から許可</li>
        </ol>
        認証情報はこの PC 内(<code>google-token.json</code>)にのみ保存されます。
      </div>
      <a class="gconnect" href="/auth/google">Google と連携する</a>`;
    return;
  }

  if (!GDATA.authorized) {
    sub.textContent = '未連携 — クリックして連携';
    $('g-badges').innerHTML = '<span class="badge">未連携</span>';
    $('g-body').innerHTML = `
      <div class="gsetup" style="margin-top:8px">認証情報は設定済みです。Google アカウントの許可を行うと、今日の予定とタスクが表示されます。<br>
      <span style="color:#8a97a6">※ 連携操作はサーバーが動いている PC のブラウザ(localhost)から行ってください。</span></div>
      <a class="gconnect" href="/auth/google">Google と連携する</a>
      ${GDATA.error ? `<div class="gsetup" style="color:#c0392b">${esc(GDATA.error)}</div>` : ''}`;
    return;
  }

  const evs = GDATA.events || [];
  const { total, done, overdue } = gTaskStats();
  const nowEv = evs.find((e) => !e.allDay && evState(e) === 'now');
  const nextEv = evs.find((e) => !e.allDay && evState(e) === 'future');
  sub.innerHTML = `予定 ${evs.length}件 ・ タスク <span class="${done < total ? '' : 'on'}">${done}/${total}</span>`
    + (nextEv ? ` ・ <span class="on">次 ${fmtTime(nextEv.start)}</span>` : nowEv ? ' ・ <span class="on">進行中</span>' : '');
  $('g-badges').innerHTML = `
    <span class="badge ${nowEv ? 'on' : ''}">📅 ${evs.length} 件</span>
    <span class="badge ${total && done === total ? 'on' : ''}">✓ ${done}/${total} タスク</span>
    ${overdue ? `<span class="badge" style="background:#c0392b">⚠ 期限切れ ${overdue}</span>` : ''}`;

  let html = gSummaryHtml();

  html += '<div class="sec-title">スケジュール</div>';
  if (!evs.length) html += '<div class="empty">今日の予定はありません</div>';
  for (const e of evs) {
    const st = evState(e);
    html += `
    <div class="gev ${e.allDay ? '' : st === 'now' ? 'now' : e === nextEv ? 'next' : st}">
      <div class="tm">${e.allDay ? '終日' : `${fmtTime(e.start)}–${fmtTime(e.end)}`}</div>
      <div>
        <div class="ttl">${esc(e.summary)}${!e.allDay && st === 'now' ? '<span class="tag">進行中</span>' : e === nextEv ? '<span class="tag">次</span>' : ''}</div>
        ${e.location ? `<div class="sub">📍 ${esc(e.location)}</div>` : ''}
        ${e.meetLink ? `<div class="sub">🎥 <a href="${esc(e.meetLink)}" target="_blank">Meet に参加</a></div>` : ''}
      </div>
    </div>`;
  }

  for (const l of GDATA.taskLists || []) {
    html += `<div class="sec-title">タスク — ${esc(l.title)}</div>`;
    if (!l.tasks.length) html += '<div class="empty" style="padding:8px 0">タスクはありません</div>';
    for (const t of l.tasks) {
      const over = !t.completed && t.due && t.due < todayStr();
      html += `
      <div class="gtask ${t.completed ? 'done' : ''}">
        <input type="checkbox" ${t.completed ? 'checked' : ''}
          onchange="toggleTask('${esc(l.id)}','${esc(t.id)}',this.checked)">
        <div>
          <div class="ttl">${esc(t.title)}${t.due ? `<span class="due ${over ? 'over' : ''}">${over ? '⚠ ' : ''}${t.due === todayStr() ? '今日' : t.due.slice(5).replace('-', '/')}</span>` : ''}</div>
          ${t.notes ? `<div class="notes">${esc(t.notes).slice(0, 80)}</div>` : ''}
        </div>
      </div>`;
    }
    html += `
    <form class="gadd" onsubmit="return addTask(event,'${esc(l.id)}')">
      <input type="text" placeholder="今日のタスクを追加..." maxlength="200">
      <button type="submit">追加</button>
    </form>`;
  }

  $('g-body').innerHTML = html;
}

function openGPanel() { closeSPanel(); $('gpanel').classList.add('open'); renderGoogle(); }
function closeGPanel() { $('gpanel').classList.remove('open'); }

async function toggleTask(listId, taskId, completed) {
  // 楽観的更新 → サーバー反映 → 再取得
  for (const l of GDATA.taskLists || []) {
    if (l.id !== listId) continue;
    const t = l.tasks.find((x) => x.id === taskId);
    if (t) t.completed = completed;
  }
  renderGoogle();
  try {
    await fetch('/api/tasks/toggle', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listId, taskId, completed }),
    });
  } finally { gtick(); }
}

function addTask(ev, listId) {
  ev.preventDefault();
  const input = ev.target.querySelector('input');
  const title = input.value.trim();
  if (!title) return false;
  input.value = '';
  fetch('/api/tasks/add', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ listId, title, due: todayStr() }),
  }).finally(() => gtick());
  return false;
}

gtick();
setInterval(gtick, 60000);

/* ══════════ 秘書アシスタント・チャット ══════════ */
let SCHAT = [];          // {role, content, hidden?, error?}
let sBusy = false;
let sStatus = null;      // {configured, model, calendarLinked}
let sGreeted = false;

const SUGGESTIONS = [
  '今日のスケジュールをまとめて',
  '今やるべきタスクは？',
  '次の予定の準備で必要なものは？',
  '期限が近いタスクを教えて',
];

async function loadSStatus() {
  try { sStatus = await (await fetch('/api/secretary/status')).json(); }
  catch { sStatus = null; }
}

function openSPanel() {
  closePanel(); closeGPanel();
  $('spanel').classList.add('open');
  renderSChat();
  if (!sGreeted) {
    sGreeted = true;
    loadSStatus().then(() => {
      renderSSug();
      if (!SCHAT.length) {
        // 初回は今日のブリーフィングを自動生成(ユーザー発話は非表示)
        sendSecretaryText('今日のスケジュールのまとめと、今日やるべきこと・準備すべきことを教えて', true);
      }
    });
  }
  setTimeout(() => { const i = $('s-input'); if (i) i.focus(); }, 320);
}
function closeSPanel() { $('spanel').classList.remove('open'); }

function renderSChat() {
  const box = $('s-chat');
  let html = '';
  for (const m of SCHAT) {
    if (m.hidden) continue;
    html += `<div class="sbubble ${m.role === 'user' ? 'user' : 'bot'}${m.error ? ' err' : ''}">`
      + (m.role === 'user' ? '' : '<span class="role">秘書</span>')
      + esc(m.content) + '</div>';
  }
  if (sBusy) html += '<div class="styping"><span></span><span></span><span></span></div>';
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function renderSSug() {
  const sub = $('s-sub');
  const mode = sStatus && sStatus.mode;
  let label;
  if (mode === 'cli') label = 'Claude(サブスク)で会話';
  else if (mode === 'api') label = 'Anthropic API で会話';
  else label = '定型まとめモード(未設定)';
  if (sStatus && !sStatus.calendarLinked) label += ' ・ カレンダー未連携';
  sub.textContent = label;
  $('s-sug').innerHTML = SUGGESTIONS.map((s, i) => `<button class="schip" onclick="suggest(${i})">${esc(s)}</button>`).join('');
}
function suggest(i) { if (!sBusy) sendSecretaryText(SUGGESTIONS[i]); }

function updateSendBtn() { const b = $('s-send'); if (b) b.disabled = sBusy; }

function sendSecretary(ev) {
  ev.preventDefault();
  const inp = $('s-input');
  const t = inp.value.trim();
  if (!t || sBusy) return false;
  inp.value = ''; inp.style.height = 'auto';
  sendSecretaryText(t);
  return false;
}

async function sendSecretaryText(text, silent) {
  if (sBusy) return;
  SCHAT.push({ role: 'user', content: text, hidden: !!silent });
  sBusy = true; updateSendBtn(); renderSChat();
  try {
    const r = await fetch('/api/secretary/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: SCHAT.filter((m) => !m.error).map((m) => ({ role: m.role, content: m.content })) }),
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    SCHAT.push({ role: 'assistant', content: j.reply });
  } catch (e) {
    SCHAT.push({ role: 'assistant', content: '応答を取得できませんでした: ' + e.message, error: true });
  } finally {
    sBusy = false; updateSendBtn(); renderSChat();
  }
}

// 入力欄: 自動リサイズ + Enter 送信(Shift+Enter で改行)
(function () {
  const inp = $('s-input');
  if (!inp) return;
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(120, inp.scrollHeight) + 'px';
  });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('s-form').requestSubmit(); }
  });
})();
