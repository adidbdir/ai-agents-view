function miniRows() {
  const all = (DATA && DATA.projects) || [];
  const order = { active: 0, recent: 1, idle: 2 };
  return all.slice()
    .sort((a, b) => (order[a.status] - order[b.status]) ||
      (Date.parse(b.lastTs || 0) - Date.parse(a.lastTs || 0)))
    .slice(0, 8);
}
function miniActiveCount() {
  return ((DATA && DATA.projects) || []).filter((p) => p.status === 'active').length;
}
function miniWaitCount() {
  const ps = (DATA && DATA.projects) || [];
  return { approval: ps.filter((p) => p.waiting === 'approval').length, input: ps.filter((p) => p.waiting === 'input').length };
}

// HTML(Document PiP)と canvas(映像PiP)の両方を最新化する
function updateMini() {
  if (MINI) {
    const act = miniActiveCount();
    const badge = MINI.querySelector('.mini-badge');
    if (badge) { badge.textContent = act > 0 ? act + ' 稼働中' : '待機中'; badge.className = 'mini-badge' + (act > 0 ? ' on' : ''); }
    // 要対応(承認待ち)のヘッダーバッジ
    const wc = miniWaitCount();
    const wb = MINI.querySelector('.mini-wait-badge');
    if (wb) {
      wb.hidden = wc.approval === 0;
      wb.textContent = '要対応 ' + wc.approval;
      wb.className = 'mini-wait-badge';
    }
    const list = MINI.querySelector('.mini-list');
    if (list) {
      const rows = miniRows();
      list.innerHTML = rows.length ? rows.map((p) => {
        const nm = p.name.length > 16 ? p.name.slice(0, 15) + '…' : p.name;
        const meta = (p.remote ? '@' + p.host + ' ・ ' : '') + timeAgo(p.lastTs);
        const w = p.waiting === 'approval' ? '<span class="mini-wait ap">!</span>' : '';
        const cls = 'mini-row' + (p.waiting === 'approval' ? ' waiting ap' : '');
        return `<div class="${cls}" data-id="${esc(p.id || p.dirName)}"><span class="mini-dot ${p.status}"></span>`
          + `<span class="mini-name">${esc(nm)}</span>${w}`
          + `<span class="mini-meta">${esc(meta)}</span></div>`;
      }).join('') : '<div class="mini-empty">セッションがありません</div>';
    }
    const foot = MINI.querySelector('.mini-foot');
    if (foot) foot.textContent = DATA ? '更新 ' + new Date(DATA.generatedAt).toLocaleTimeString('ja-JP') : '接続待ち…';
  }
  if (pipCtx) drawMiniCanvas();
}

// 画面切替(一覧 / 詳細 / 秘書)。Document PiP でのみ操作可能。

  if (!p) { showMiniScreen('list'); return; }

  const waitBadge = p.waiting === 'approval' ? '<span class="mini-dbadge wait ap">! 対応待ち</span>' : '';
  if (badges) badges.innerHTML =
      `<span class="mini-dbadge ${p.status === 'active' ? 'on' : ''}">● ${stLabel}</span>`
    + waitBadge
    + (p.remote ? `<span class="mini-dbadge">💻 ${esc(p.host)}</span>` : '')
    + `<span class="mini-dbadge">${p.sessionCount} セッション</span>`
    + `<span class="mini-dbadge">🔧 ${fmtNum(p.totalToolCalls)}</span>`
    + `<span class="mini-dbadge">⚡ ${fmtNum(p.outputTokens)}</span>`;
  if (body) {
    body.innerHTML = (p.sessions || []).map((s) => {
      const nm = esc(s.title || s.firstPrompt || s.sessionId.slice(0, 8));
      const msgs = (s.userMessages || 0) + (s.assistantMessages || 0);
      const wl = s.waiting === 'approval' ? '<b style="color:#ef8b3c">! 対応待ち</b>' : '';
      const parts = [
        wl,
        `<b>${timeAgo(s.lastTs)}</b>`,
        s.model ? esc(s.model) : '',
        `💬 ${msgs}`,
        `⚡ ${fmtNum(s.outputTokens || 0)}`,
        s.totalAgents ? `🤖 ${s.totalAgents}${s.runningAgents ? '(稼働' + s.runningAgents + ')' : ''}` : '',
      ].filter(Boolean);
      return `<div class="mini-sess"><div class="nm"><span class="mini-dot ${s.status}" style="display:inline-block;margin-right:6px"></span>${nm}</div>`
        + `<div class="mt">${parts.map((x) => `<span>${x}</span>`).join('')}</div></div>`;
    }).join('') || '<div class="mini-empty">セッションがありません</div>';
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 映像PiP 用: ステータスを 2D canvas に描画する
function drawMiniCanvas() {
  const ctx = pipCtx; if (!ctx) return;
  const W = 300, H = 380;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#141e2b'; roundRect(ctx, 0, 0, W, H, 16); ctx.fill();
  // ヘッダー
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff'; ctx.font = '800 16px -apple-system,"Hiragino Sans",sans-serif';
  ctx.fillText('AI Agents', 16, 30);
  const act = miniActiveCount();
  const bText = act > 0 ? act + ' 稼働中' : '待機中';
  ctx.font = '800 12px -apple-system,"Hiragino Sans",sans-serif';
  const bw = ctx.measureText(bText).width + 18;
  ctx.fillStyle = act > 0 ? '#2fb9dd' : '#33475b';
  roundRect(ctx, W - 16 - bw, 16, bw, 21, 10); ctx.fill();
  ctx.fillStyle = act > 0 ? '#06303c' : '#cfe0ea';
  ctx.fillText(bText, W - 16 - bw + 9, 31);
  // 要対応(承認待ち)バッジ(稼働中バッジの左)
  const wc = miniWaitCount();
  if (wc.approval > 0) {
    const wText = '要対応 ' + wc.approval;
    const ww = ctx.measureText(wText).width + 18;
    const wx = W - 16 - bw - 7 - ww;
    ctx.fillStyle = '#ef8b3c';
    roundRect(ctx, wx, 16, ww, 21, 10); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(wText, wx + 9, 31);
  }
  // 行
  const rows = miniRows();
  ctx.textBaseline = 'middle';
  let y = 54;
  if (!rows.length) {
    ctx.fillStyle = '#7d8ea0'; ctx.font = '500 13px -apple-system,"Hiragino Sans",sans-serif';
    ctx.fillText('セッションがありません', 16, 72);
  }
  for (const p of rows) {
    const col = p.status === 'active' ? '#59d2f2' : p.status === 'recent' ? '#3a7bd5' : '#8496a6';
    if (p.status === 'active') { ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 8; }
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(23, y + 10, 5, 0, Math.PI * 2); ctx.fill();
    if (p.status === 'active') ctx.restore();
    ctx.fillStyle = '#e8eef6'; ctx.font = '600 13px -apple-system,"Hiragino Sans",sans-serif';
    const isWait = p.waiting === 'approval';
    const nm = p.name.length > (isWait ? 13 : 16) ? p.name.slice(0, (isWait ? 12 : 15)) + '…' : p.name;
    ctx.fillText(nm, 38, y + 10);
    ctx.fillStyle = '#7d8ea0'; ctx.font = '500 11px -apple-system,"Hiragino Sans",sans-serif';
    const meta = timeAgo(p.lastTs);
    const mw = ctx.measureText(meta).width;
    ctx.fillText(meta, W - 16 - mw, y + 10);
    // 承認待ちバッジ(経過時間の左)
    if (isWait) {
      ctx.font = '800 11px -apple-system,"Hiragino Sans",sans-serif';
      const label = '!', lw = ctx.measureText(label).width, pbw = lw + 11;
      const bx = W - 16 - mw - 8 - pbw;
      ctx.fillStyle = '#ef8b3c';
      roundRect(ctx, bx, y + 2, pbw, 16, 5); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillText(label, bx + 5.5, y + 10);
    }
    y += 30;
    if (y > H - 34) break;
  }
  // フッター
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#5f7186'; ctx.font = '500 10.5px -apple-system,"Hiragino Sans",sans-serif';
  ctx.fillText(DATA ? '更新 ' + new Date(DATA.generatedAt).toLocaleTimeString('ja-JP') : '接続待ち…', 16, H - 13);
  // captureStream に新フレームを要求
  if (pipStream) { const tr = pipStream.getVideoTracks()[0]; if (tr && tr.requestFrame) tr.requestFrame(); }
}

function setPipBtn(on) {
  const b = $('pip-btn');
  if (b) { b.classList.toggle('on', on); b.textContent = on ? '🖼 ミニ表示中' : '🖼 ミニ表示'; }
}

const HAS_DOC_PIP = !!(window.documentPictureInPicture && documentPictureInPicture.requestWindow);

function togglePiP() {
  // すでに表示中なら閉じる(トグル)
  if (pipWin) { pipWin.close(); return; }
  if (document.pictureInPictureElement) { document.exitPictureInPicture().catch(() => {}); return; }
  // 1) Document Picture-in-Picture(Chrome/Edge): HTML をそのまま小窓に
  if (HAS_DOC_PIP) { openDocPiP(); return; }
  // 2) 映像PiP フォールバック(Safari 等)
  openVideoPiP();
}

async function openDocPiP() {
  try {
    const w = await documentPictureInPicture.requestWindow({ width: 300, height: 380 });
    const st = w.document.createElement('style');
    st.textContent = MINI_CSS;
    w.document.head.appendChild(st);
    MINI.style.display = 'flex';
    w.document.body.appendChild(MINI);   // 要素を PiP ウィンドウへ移動
    pipWin = w;
    showMiniScreen('list');
    w.addEventListener('pagehide', closePiPDoc);
    setPipBtn(true);
  } catch (e) {
    console.warn('Document PiP 失敗、映像PiP を試します:', e);
    openVideoPiP();   // 環境によっては映像PiP で救済
  }
}

function closePiPDoc() {
  showMiniScreen('list');   // 次回の表示は一覧から
  if (MINI) { MINI.style.display = 'none'; document.body.appendChild(MINI); } // 本体へ戻す
  pipWin = null;
  setPipBtn(false);
}

// 映像PiP 用の video/canvas を用意(Safari ではクリック時の gesture を確実にするため
// 事前に生成・再生しておき、クリック時は同期的に requestPictureInPicture を呼ぶ)
function ensureVideoReady() {
  if (pipVideo) return;
  const DPR = 2, W = 300, H = 380;
  pipCanvas = document.createElement('canvas');
  pipCanvas.width = W * DPR; pipCanvas.height = H * DPR;
  pipCtx = pipCanvas.getContext('2d');
  pipCtx.scale(DPR, DPR);
  drawMiniCanvas();
  pipStream = pipCanvas.captureStream();
  pipVideo = document.createElement('video');
  pipVideo.muted = true; pipVideo.playsInline = true; pipVideo.srcObject = pipStream;
  pipVideo.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;pointer-events:none;';
  document.body.appendChild(pipVideo);
  pipVideo.play().catch(() => {});
  pipVideo.addEventListener('leavepictureinpicture', onLeaveVideoPiP);
}

function openVideoPiP() {
  if (!('pictureInPictureEnabled' in document) || !document.pictureInPictureEnabled) {
    alert('このブラウザは小型表示(Picture-in-Picture)に対応していません。\nChrome / Edge / Safari で開いてください。');
    return;
  }
  ensureVideoReady();
  const go = () => pipVideo.requestPictureInPicture()
    .then(() => { pipTimer = setInterval(drawMiniCanvas, 1000); setPipBtn(true); })
    .catch((e) => alert('小型表示を開始できませんでした: ' + e.message));
  if (pipVideo.readyState >= 1) go();
  else pipVideo.addEventListener('loadedmetadata', go, { once: true });
}

function onLeaveVideoPiP() {
  if (pipTimer) { clearInterval(pipTimer); pipTimer = null; }
  setPipBtn(false);   // video/stream は次回のため保持する
}

// Document PiP 非対応(Safari 等)では、初回クリックで確実に開けるよう事前準備
if (!HAS_DOC_PIP && 'pictureInPictureEnabled' in document && document.pictureInPictureEnabled) {
  setTimeout(ensureVideoReady, 1500);
}

function computeUnread() {
  if (!XSTATUS || !XSTATUS.reports) return false;
  let newest = 0;
  for (const r of Object.values(XSTATUS.reports)) newest = Math.max(newest, r.at || 0);
  if (!newest) return false;
  return newest > Number(localStorage.getItem('xSeenAt') || 0);
}

const xSleep = (ms) => new Promise((r) => setTimeout(r, ms));

// 1トピックを調査。サーバーが別の調査(週次など)で混雑中なら待って再試行する。
async function researchOne(topic) {
  const BUSY_RETRIES = 20; // 混雑時は最大 ~3分待って再試行
  for (let attempt = 0; ; attempt++) {
    let j, ok, status;
    try {
      const r = await fetch('/api/explorer/research', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic }),
      });
      ok = r.ok; status = r.status; j = await r.json();
    } catch (e) {
      if (attempt < 2) { await xSleep(5000); continue; } // 一時的な通信エラーは再試行
      return { ok: false, error: e.message };
    }
    if (j && j.running) { // 別の調査が実行中 → 待って再試行(週次との競合対策)
      if (attempt < BUSY_RETRIES) { await xSleep(9000); continue; }
      return { ok: false, error: '混雑のため開始できませんでした' };
    }
    if (!ok || (j && j.error)) return { ok: false, error: (j && j.error) || ('HTTP ' + status) };
    return { ok: true };
  }
}

// 複数トピックをまとめて追加し、未取得のものを順番に調査する
async function runResearchBatch(topics) {
  if (xBusy) return;
  xBusy = true;
  $('x-send').disabled = true;
  const MAX = 8;
  try {
    // 新規を先頭にしてマージ・保存(即座にチップ表示)
    const existing = (XSTATUS && XSTATUS.topics) || [];
    const merged = [...new Set([...topics, ...existing])].slice(0, MAX);
    await saveTopicsList(merged);
    await loadXStatus();
    renderXTop();
    // 保存された範囲で、まだレポートが無いトピックだけ調査
    const saved = (XSTATUS && XSTATUS.topics) || merged;
    const reports = (XSTATUS && XSTATUS.reports) || {};
    const todo = topics.filter((t) => saved.includes(t) && !reports[t]);
    const body = $('x-body');
    let lastError = '';
    for (let i = 0; i < todo.length; i++) {
      const t = todo[i];
      xCurrent = t;
      xProgress = { current: t };
      renderXChips();
      const prog = todo.length > 1 ? `(${i + 1}/${todo.length}) ` : '';
      body.innerHTML = `<div class="xspin"><i></i>${prog}「${esc(t)}」を調査中…(各30秒〜数分かかります)</div>`;
      const res = await researchOne(t);
      if (!res.ok) lastError = `「${t}」: ${res.error}`;
      await loadXStatus();
      renderXChips(); // 完了したチップを随時反映
    }
    xProgress = null;
    renderXChips();
    localStorage.setItem('xSeenAt', String(Date.now()));
    // 調査できたものの先頭を表示。全滅ならエラー、なければ空案内。
    const reportsNow = (XSTATUS && XSTATUS.reports) || {};
    const firstDone = todo.find((t) => reportsNow[t]) || saved.find((t) => reportsNow[t]);
    if (firstDone) showReport(firstDone);
    else if (lastError) body.innerHTML = `<div class="xempty">調査に失敗しました(${esc(lastError)})</div>`;
    else renderXBody();
  } finally {
    xProgress = null;
    xBusy = false; $('x-send').disabled = false;
    renderXChips();
  }
}

async function deleteTopic(topic) {
  const topics = ((XSTATUS && XSTATUS.topics) || []).filter((t) => t !== topic);
  try {
    await fetch('/api/explorer/topics', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topics }),
    });
  } catch { /* ignore */ }
  if (xCurrent === topic) xCurrent = null;
  await loadXStatus();
  renderXChips();
  const rest = (XSTATUS && XSTATUS.topics) || [];
  if (xCurrent) showReport(xCurrent);
  else if (rest.length) showReport(rest[0]);
  else renderXBody();
}

// 簡易 Markdown → 安全な HTML(先に全体をエスケープしてから既知タグのみ復元)
function mdInline(s) {
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (m, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
  return s;
}
function mdToHtml(md) {
  const lines = esc(md).split('\n');
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    let m;
    if ((m = line.match(/^#{1,6}\s+(.*)$/))) { closeList(); html += `<h4>${mdInline(m[1])}</h4>`; }
    else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${mdInline(m[1])}</li>`; }
    else if (line.trim() === '') { closeList(); }
    else { closeList(); html += `<p>${mdInline(line)}</p>`; }
  }
  closeList();
  return html;
}

function renderHRevenueGraph(monthly) {
  if (!monthly.length) return '<div class="empty" style="padding:12px 0">収益記録はまだありません</div>';
  const W = 360, H = 140;
  const max = Math.max(1, ...monthly.map((m) => m.total));
  const bw = Math.max(24, Math.floor((W - 20) / monthly.length) - 10);
  const gap = Math.max(8, Math.floor((W - 20 - bw * monthly.length) / Math.max(1, monthly.length - 1)));
  let bars = '', labels = '';
  monthly.forEach((m, i) => {
    const h = Math.max(4, Math.round((m.total / max) * 88));
    const x = 10 + i * (bw + gap);
    const y = 108 - h;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="6" fill="url(#hg${i})"/>`;
    bars += `<defs><linearGradient id="hg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b748"/><stop offset="1" stop-color="#1faa84"/></linearGradient></defs>`;
    labels += `<text x="${x + bw / 2}" y="126" font-size="10" text-anchor="middle" fill="#6e7f90">${esc(m.month.slice(5))}</text>`;
  });
  return `<div class="hgraph"><svg viewBox="0 0 ${W} ${H}">
    <line x1="10" y1="108" x2="${W - 10}" y2="108" stroke="#d8e1ea" stroke-width="1"/>
    ${bars}${labels}
  </svg></div>`;
}

function fmtPct(n) {
  const v = Number(n);
  return Number.isFinite(v) ? `${v >= 0 ? '+' : ''}${v.toFixed(1)}%` : '—';
}
function fmtTraderQty(n) {
  const v = Number(n);
  if (!Number.isFinite(v)) return '0';
  const digits = v >= 1 ? 4 : 6;
  return v.toFixed(digits).replace(/\.?0+$/, '');
}

function parseTraderAssets(raw) {

function parseTraderSymbolMap(raw) {
  const out = {};
  for (const line of String(raw || '').split(/\n|,/)) {
    const m = line.trim().match(/^([a-z0-9_-]+)\s*[:=]\s*([A-Za-z0-9=._-]+)$/);
    if (!m) continue;
    out[m[1].toLowerCase()] = m[2].toUpperCase();
  }
  return out;
}

function renderTEquityChart(history, startBalance) {
  if (!history.length) return '<div class="tlist-empty">equity の記録はまだありません</div>';
  const W = 420, H = 160, P = 18;
  const vals = history.map((x) => Number(x.equity) || 0);
  vals.push(Number(startBalance) || 0);
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const span = Math.max(1, max - min);
  const pts = history.map((item, i) => {
    const x = P + (history.length === 1 ? (W - P * 2) / 2 : ((W - P * 2) * i / (history.length - 1)));
    const y = H - P - (((Number(item.equity) || 0) - min) / span) * (H - P * 2);
    return `${x},${y}`;
  }).join(' ');
  const baseY = H - P - (((Number(startBalance) || 0) - min) / span) * (H - P * 2);
  return `<div class="tchart"><svg viewBox="0 0 ${W} ${H}">
    <line x1="${P}" y1="${baseY}" x2="${W - P}" y2="${baseY}" stroke="#d9e5de" stroke-dasharray="4 4"/>
    <polyline points="${pts}" fill="none" stroke="#1e8b72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${P}" y="${Math.max(12, baseY - 6)}" font-size="10" fill="#7b8794">初期 ${esc(fmtMoney(startBalance))}</text>
    <text x="${W - P}" y="${H - 4}" text-anchor="end" font-size="10" fill="#7b8794">${esc(history[history.length - 1].date || '')}</text>
  </svg></div>`;
}

// 右ドッキングのパネルは幅を増やすと左へ広がる。localStorage に幅を保存・復元。
function makeResizable(panelId, handle) {
  if (!handle) return;
  const saved = localStorage.getItem('pw:' + panelId);
  if (saved) $(panelId).style.width = saved;
  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const panel = $(panelId);
    const startX = e.clientX;
    const startW = panel.getBoundingClientRect().width;
    const minW = 360, maxW = window.innerWidth * 0.92;
    document.body.style.userSelect = 'none';
    try { handle.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    const move = (ev) => {
      const w = Math.max(minW, Math.min(maxW, startW + (startX - ev.clientX)));
      panel.style.width = w + 'px';
    };
    const up = () => {
      document.body.style.userSelect = '';
      try { handle.releasePointerCapture(e.pointerId); } catch { /* ignore */ }
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      if (panel.style.width) localStorage.setItem('pw:' + panelId, panel.style.width);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  });
}
makeResizable('spanel', $('s-resize'));
makeResizable('xpanel', $('x-resize'));
makeResizable('hpanel', $('h-resize'));

// 空色のキーフレーム [時刻, [上, 中, 地平線]]。間を補間して滑らかに遷移。
const SKY_KF = [
  [0,    ['#0a1026', '#111a38', '#1b2749']],
  [4.5,  ['#182247', '#2c2e57', '#5b3f63']],
  [6,    ['#3b4f80', '#8a6f92', '#d98f7e']],
  [7,    ['#6f92c8', '#cfa58e', '#f3c896']],
  [9,    ['#7fb0e6', '#aecdec', '#e0eefb']],
  [12,   ['#4f97e0', '#8fbdee', '#e8f3fd']],
  [15,   ['#5f97dc', '#a3c6ea', '#eef2e6']],
  [17,   ['#6480bd', '#d69f7e', '#f6cd8e']],
  [18.5, ['#4a4a86', '#b76a80', '#ec9046']],
  [19.7, ['#2a2f5c', '#5a4a76', '#8a5570']],
  [21,   ['#141c3e', '#26305a', '#3c4570']],
  [22.5, ['#0c1329', '#151d3d', '#222c50']],
  [24,   ['#0a1026', '#111a38', '#1b2749']],
];
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function rgb(a) { return `rgb(${a[0]},${a[1]},${a[2]})`; }
function skyColors(h) {
  let lo = SKY_KF[0], hi = SKY_KF[SKY_KF.length - 1];
  for (let i = 0; i < SKY_KF.length - 1; i++) {
    if (h >= SKY_KF[i][0] && h <= SKY_KF[i + 1][0]) { lo = SKY_KF[i]; hi = SKY_KF[i + 1]; break; }
  }
  const t = hi[0] === lo[0] ? 0 : (h - lo[0]) / (hi[0] - lo[0]);
  return [0, 1, 2].map((k) => rgb(mix(hex2rgb(lo[1][k]), hex2rgb(hi[1][k]), t)));
}
// 太陽/月の位置(空を弧を描いて横断)
function celestialAt(h) {
  const day = h >= 5.3 && h < 18.7;
  let p;
  if (day) p = (h - 5.3) / (18.7 - 5.3);
  else { const hh = h < 5.3 ? h + 24 : h; p = (hh - 18.7) / (5.3 + 24 - 18.7); }
  const x = 8 + p * 84;                       // 8%〜92%(東→西)
  const y = 82 - Math.sin(p * Math.PI) * 64;  // 弧: 地平線82%〜天頂18%
  const edge = Math.min(1, Math.min(p, 1 - p) / 0.14); // 0=地平線際 1=空高く
  return { x, y, isSun: day, edge };
}
// 星の明るさ(夜=1、薄明で減衰)
function starAlpha(h) {
  if (h < 4.5 || h >= 21.5) return 1;
  if (h < 6.5) return Math.max(0, (6.5 - h) / 2);
  if (h < 19.5) return 0;
  return Math.min(1, (h - 19.5) / 2);
}
function phaseInfo(h) {
  if (h < 4.5)  return ['🌙', '深夜'];
  if (h < 6.5)  return ['🌅', '夜明け'];
  if (h < 9)    return ['🌄', '早朝'];
  if (h < 11)   return ['☀️', '午前'];
  if (h < 14)   return ['☀️', '日中'];
  if (h < 16.5) return ['🌤️', '午後'];
  if (h < 18.5) return ['🌇', '夕方'];
  if (h < 20)   return ['🌆', '夕暮れ'];
  if (h < 22.5) return ['🌙', '宵'];
  return ['🌙', '深夜'];
}
function buildStars() {
  const box = $('stars');
  if (box.childElementCount) return;
  let html = '';
  for (let i = 0; i < 80; i++) {
    const x = (Math.random() * 100).toFixed(2);
    const y = (Math.random() * 62).toFixed(2);      // 上部62%だけに配置
    const s = (Math.random() * 1.6 + 1).toFixed(2);
    const tw = (Math.random() * 4 + 2.5).toFixed(1);
    const dl = (Math.random() * 5).toFixed(1);
    html += `<i style="left:${x}%;top:${y}%;width:${s}px;height:${s}px;--tw:${tw}s;animation-delay:${dl}s"></i>`;
  }
  box.innerHTML = html;
}
function updateSky() {
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  const [top, mid, hor] = skyColors(h);
  $('sky').style.background = `linear-gradient(180deg, ${top} 0%, ${mid} 46%, ${hor} 100%)`;

  const c = celestialAt(h);
  const cel = $('celestial');
  cel.style.left = c.x + '%';
  cel.style.top = c.y + '%';
  if (c.isSun) {
    // 地平線際は赤みが強く、高いほど明るい黄
    const disc = rgb(mix(hex2rgb('#ff8a4c'), hex2rgb('#fff4bf'), c.edge));
    const glow = rgb(mix(hex2rgb('#ff7a3c'), hex2rgb('#ffd97a'), c.edge));
    cel.style.background = `radial-gradient(circle, #fffaf0 0%, ${disc} 68%, ${disc} 100%)`;
    cel.style.boxShadow = `0 0 60px 24px ${glow}, 0 0 140px 60px ${glow}55`;
    cel.style.width = cel.style.height = '78px';
  } else {
    cel.style.background = `radial-gradient(circle at 38% 34%, #fdffff 0%, #e7eeff 55%, #cdd8f5 100%)`;
    cel.style.boxShadow = `0 0 40px 12px rgba(200,214,255,.45), 0 0 90px 30px rgba(170,190,245,.25)`;
    cel.style.width = cel.style.height = '58px';
  }

  const sa = starAlpha(h);
  $('stars').style.opacity = sa;
  $('clouds').style.opacity = (0.85 * (1 - sa) * (c.isSun ? 1 : 0.5)).toFixed(2);

  const [icon, label] = phaseInfo(h);
  $('tod-icon').textContent = icon;
  $('tod-text').textContent = `${label} ・ ${now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}`;
  $('tod-pill').classList.toggle('night', sa > 0.5);
}
buildStars();
updateSky();
setInterval(updateSky, 30000);

/* ══════════ Google 今日の予定 / タスク ══════════ */
let GDATA = null;

function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function evState(e) { // 'past' | 'now' | 'future'
  if (e.allDay) return 'now';
  const now = Date.now();
  if (Date.parse(e.end) <= now) return 'past';
  if (Date.parse(e.start) <= now) return 'now';
  return 'future';
}

async function gtick() {
  try {
    const r = await fetch('/api/agenda');
    GDATA = await r.json();
  } catch { GDATA = null; }
  renderGoogle();
}

function gTaskStats() {
  let total = 0, done = 0, overdue = 0;
  for (const l of GDATA.taskLists || []) {
    for (const t of l.tasks) {
      total++;
      if (t.completed) done++;
      else if (t.due && t.due < todayStr()) overdue++;
    }
  }
  return { total, done, overdue };
}

/** 今日のまとめ文 */
function gSummaryHtml() {
  const evs = GDATA.events || [];
  const timed = evs.filter((e) => !e.allDay);
  const nowEv = timed.find((e) => evState(e) === 'now');
  const nextEv = timed.find((e) => evState(e) === 'future');
  const { total, done, overdue } = gTaskStats();
  const parts = [];
  if (!evs.length) parts.push('今日の予定はありません。');
  else {
    let s = `予定は <b>${evs.length}件</b>`;
    if (timed.length) s += `(${fmtTime(timed[0].start)}〜${fmtTime(timed[timed.length - 1].end)})`;
    parts.push(s + '。');
  }
  if (nowEv) parts.push(`進行中: <b>${esc(nowEv.summary)}</b>(〜${fmtTime(nowEv.end)})。`);
  if (nextEv) {
    const min = Math.max(0, Math.round((Date.parse(nextEv.start) - Date.now()) / 60000));
    const rel = min < 60 ? `あと${min}分` : `あと${Math.floor(min / 60)}時間${min % 60 ? (min % 60) + '分' : ''}`;
    parts.push(`次は ${fmtTime(nextEv.start)}〜 <b>${esc(nextEv.summary)}</b>(${rel})。`);
  }
  if (total) {
    let s = `タスクは 残り <b>${total - done}件</b> / 完了 ${done}件`;
    if (overdue) s += `(<span style="color:#c0392b;font-weight:700">期限切れ ${overdue}件</span>)`;
    parts.push(s + '。');
  } else parts.push('タスクはありません。');
  return `<div class="gsummary">${parts.join(' ')}</div>`;
}

function renderGoogle() {
  const sub = $('gcal-sub');
  const d = new Date();
  $('g-date').textContent =
    `${d.getMonth() + 1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;

  if (!GDATA) { sub.textContent = 'サーバーに接続できません'; $('g-body').innerHTML = '<div class="empty">サーバーに接続できません</div>'; $('g-badges').innerHTML = ''; return; }

  if (!GDATA.configured) {
    sub.textContent = '未設定 — クリックして設定方法を表示';
    $('g-badges').innerHTML = '<span class="badge">未設定</span>';
    $('g-body').innerHTML = `
      <div class="sec-title">セットアップ</div>
      <div class="gsetup">
        Google カレンダー / ToDo と連携するには、一度だけ OAuth クライアントの作成が必要です:
        <ol>
          <li><a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a> でプロジェクトを作成</li>
          <li>「APIとサービス → ライブラリ」で <b>Google Calendar API</b> と <b>Google Tasks API</b> を有効化</li>
          <li>「認証情報 → 認証情報を作成 → OAuth クライアント ID」で種類 <b>デスクトップアプリ</b> を選択して作成<br>(初回は OAuth 同意画面の設定が必要。テストユーザーに自分の Gmail を追加)</li>
          <li>JSON をダウンロードし、このアプリのフォルダに <code>google-credentials.json</code> として保存</li>
          <li>サーバーを再起動せずそのまま、下の「連携する」から許可</li>
        </ol>
        認証情報はこの PC 内(<code>google-token.json</code>)にのみ保存されます。
      </div>
      <a class="gconnect" href="/auth/google">Google と連携する</a>`;
    return;
  }

  if (!GDATA.authorized) {
    sub.textContent = '未連携 — クリックして連携';
    $('g-badges').innerHTML = '<span class="badge">未連携</span>';
    $('g-body').innerHTML = `
      <div class="gsetup" style="margin-top:8px">認証情報は設定済みです。Google アカウントの許可を行うと、今日の予定とタスクが表示されます。<br>
      <span style="color:#8a97a6">※ 連携操作はサーバーが動いている PC のブラウザ(localhost)から行ってください。</span></div>
      <a class="gconnect" href="/auth/google">Google と連携する</a>
      ${GDATA.error ? `<div class="gsetup" style="color:#c0392b">${esc(GDATA.error)}</div>` : ''}`;
    return;
  }

  const evs = GDATA.events || [];
  const { total, done, overdue } = gTaskStats();
  const nowEv = evs.find((e) => !e.allDay && evState(e) === 'now');
  const nextEv = evs.find((e) => !e.allDay && evState(e) === 'future');
  sub.innerHTML = `予定 ${evs.length}件 ・ タスク <span class="${done < total ? '' : 'on'}">${done}/${total}</span>`
    + (nextEv ? ` ・ <span class="on">次 ${fmtTime(nextEv.start)}</span>` : nowEv ? ' ・ <span class="on">進行中</span>' : '');
  $('g-badges').innerHTML = `
    <span class="badge ${nowEv ? 'on' : ''}">📅 ${evs.length} 件</span>
    <span class="badge ${total && done === total ? 'on' : ''}">✓ ${done}/${total} タスク</span>
    ${overdue ? `<span class="badge" style="background:#c0392b">⚠ 期限切れ ${overdue}</span>` : ''}`;

  let html = gSummaryHtml();

  html += '<div class="sec-title">スケジュール</div>';
  if (!evs.length) html += '<div class="empty">今日の予定はありません</div>';
  for (const e of evs) {
    const st = evState(e);
    html += `
    <div class="gev ${e.allDay ? '' : st === 'now' ? 'now' : e === nextEv ? 'next' : st}">
      <div class="tm">${e.allDay ? '終日' : `${fmtTime(e.start)}–${fmtTime(e.end)}`}</div>
      <div>
        <div class="ttl">${esc(e.summary)}${!e.allDay && st === 'now' ? '<span class="tag">進行中</span>' : e === nextEv ? '<span class="tag">次</span>' : ''}</div>
        ${e.location ? `<div class="sub">📍 ${esc(e.location)}</div>` : ''}
        ${e.meetLink ? `<div class="sub">🎥 <a href="${esc(e.meetLink)}" target="_blank">Meet に参加</a></div>` : ''}
      </div>
    </div>`;
  }

  for (const l of GDATA.taskLists || []) {
    html += `<div class="sec-title">タスク — ${esc(l.title)}</div>`;
    if (!l.tasks.length) html += '<div class="empty" style="padding:8px 0">タスクはありません</div>';
    for (const t of l.tasks) {
      const over = !t.completed && t.due && t.due < todayStr();
      html += `
      <div class="gtask ${t.completed ? 'done' : ''}">
        <input type="checkbox" ${t.completed ? 'checked' : ''}
          onchange="toggleTask('${esc(l.id)}','${esc(t.id)}',this.checked)">
        <div>
          <div class="ttl">${esc(t.title)}${t.due ? `<span class="due ${over ? 'over' : ''}">${over ? '⚠ ' : ''}${t.due === todayStr() ? '今日' : t.due.slice(5).replace('-', '/')}</span>` : ''}</div>
          ${t.notes ? `<div class="notes">${esc(t.notes).slice(0, 80)}</div>` : ''}
        </div>
      </div>`;
    }
    html += `
    <form class="gadd" onsubmit="return addTask(event,'${esc(l.id)}')">
      <input type="text" placeholder="今日のタスクを追加..." maxlength="200">
      <button type="submit">追加</button>
    </form>`;
  }

  $('g-body').innerHTML = html;
}

function openGPanel() { closeSPanel(); closeXPanel(); closeHPanel(); closeTPanel(); $('gpanel').classList.add('open'); renderGoogle(); }
function closeGPanel() { $('gpanel').classList.remove('open'); }

async function toggleTask(listId, taskId, completed) {
  // 楽観的更新 → サーバー反映 → 再取得
  for (const l of GDATA.taskLists || []) {
    if (l.id !== listId) continue;
    const t = l.tasks.find((x) => x.id === taskId);
    if (t) t.completed = completed;
  }
  renderGoogle();
  try {
    await fetch('/api/tasks/toggle', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listId, taskId, completed }),
    });
  } finally { gtick(); }
}

function addTask(ev, listId) {
  ev.preventDefault();
  const input = ev.target.querySelector('input');
  const title = input.value.trim();
  if (!title) return false;
  input.value = '';
  fetch('/api/tasks/add', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ listId, title, due: todayStr() }),
  }).finally(() => gtick());
  return false;
}

gtick();
setInterval(gtick, 60000);

/* ══════════ 秘書アシスタント・チャット ══════════ */
// 秘書チャットの履歴はサーバー(secretary-state.json)に約1日分保存し、
// PC・スマホなど複数端末で共有する。パネルを開くたびに最新を取得する。
let SCHAT = [];          // {role, content, hidden?, error?}
let schatLoaded = false;
async function loadSChatFromServer() {
  try {
    const j = await (await fetch('/api/secretary/history')).json();
    if (j && Array.isArray(j.messages)) SCHAT = j.messages;
  } catch {}
  schatLoaded = true;
}
let sSaveTimer = null;
function saveSChat() {
  // エラー吹き出しは保存しない(再送時の履歴汚染を避ける)。連続保存はまとめる。
  clearTimeout(sSaveTimer);
  sSaveTimer = setTimeout(() => {
    const items = SCHAT.filter((m) => !m.error).map((m) => ({ role: m.role, content: m.content, hidden: !!m.hidden }));
    fetch('/api/secretary/history', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: items }),
    }).catch(() => {});
  }, 400);
}

let sBusy = false;
let sStatus = null;      // {configured, model, calendarLinked}
let sGreeted = false;

const SUGGESTIONS = [
  '今日のスケジュールをまとめて',
  '今やるべきタスクは？',
  '次の予定の準備で必要なものは？',
  '期限が近いタスクを教えて',
];

async function loadSStatus() {
  try { sStatus = await (await fetch('/api/secretary/status')).json(); }
  catch { sStatus = null; }
}

async function openSPanel() {
  closePanel(); closeGPanel(); closeXPanel(); closeHPanel(); closeTPanel();
  $('spanel').classList.add('open');
  renderSChat();
  // 開くたびにサーバーから最新履歴を取得(他端末での会話を反映)。
  // 送信中の取得は進行中の会話を上書きしうるため避ける。
  if (!sBusy) { await loadSChatFromServer(); renderSChat(); }
  if (!sGreeted) {
    sGreeted = true;
    await loadSStatus();
    renderSSug();
    if (!SCHAT.length) {
      // 履歴が空のときだけ、今日のブリーフィングを自動生成(ユーザー発話は非表示)
      sendSecretaryText('今日のスケジュールのまとめと、今日やるべきこと・準備すべきことを教えて', true);
    }
  }
  setTimeout(() => { const i = $('s-input'); if (i) i.focus(); }, 320);
}
function closeSPanel() { $('spanel').classList.remove('open'); }

function renderSChat() {
  const box = $('s-chat');
  let html = '';
  for (const m of SCHAT) {
    if (m.hidden) continue;
    html += `<div class="sbubble ${m.role === 'user' ? 'user' : 'bot'}${m.error ? ' err' : ''}">`
      + (m.role === 'user' ? '' : '<span class="role">秘書</span>')
      + esc(m.content) + '</div>';
  }
  if (sBusy) html += '<div class="styping"><span></span><span></span><span></span></div>';
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
  renderMiniSChat();   // 秘書ミニ画面(PiP)も同期
}

function renderSSug() {
  const sub = $('s-sub');
  const mode = sStatus && sStatus.mode;
  let label;
  if (mode === 'cli') label = 'Claude(サブスク)で会話';
  else if (mode === 'api') label = 'Anthropic API で会話';
  else label = '定型まとめモード(未設定)';
  if (sStatus && !sStatus.calendarLinked) label += ' ・ カレンダー未連携';
  sub.textContent = label;
  $('s-sug').innerHTML = SUGGESTIONS.map((s, i) => `<button class="schip" onclick="suggest(${i})">${esc(s)}</button>`).join('');
}
function suggest(i) { if (!sBusy) sendSecretaryText(SUGGESTIONS[i]); }

function updateSendBtn() { const b = $('s-send'); if (b) b.disabled = sBusy; }

function sendSecretary(ev) {
  ev.preventDefault();
  const inp = $('s-input');
  const t = inp.value.trim();
  if (!t || sBusy) return false;
  inp.value = ''; inp.style.height = 'auto';
  sendSecretaryText(t);
  return false;
}

async function sendSecretaryText(text, silent) {
  if (sBusy) return;
  SCHAT.push({ role: 'user', content: text, hidden: !!silent });
  sBusy = true; updateSendBtn(); renderSChat(); saveSChat();
  try {
    const r = await fetch('/api/secretary/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: SCHAT.filter((m) => !m.error).map((m) => ({ role: m.role, content: m.content })) }),
    });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status));
    SCHAT.push({ role: 'assistant', content: j.reply });
    saveSChat();   // 会話が成立したらサーバーへ保存(端末間で共有)
  } catch (e) {
    SCHAT.push({ role: 'assistant', content: '応答を取得できませんでした: ' + e.message, error: true });
  } finally {
    sBusy = false; updateSendBtn(); renderSChat();
  }
}

// 入力欄: 自動リサイズ + Enter 送信(Shift+Enter で改行)
(function () {
  const inp = $('s-input');
  if (!inp) return;
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(120, inp.scrollHeight) + 'px';
  });
  inp.addEventListener('keydown', (e) => {
    // IME 変換中(日本語入力の確定など)の Enter は送信しない
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      $('s-form').requestSubmit();
    }
  });
})();
